name: CI
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run focused Round 1G tests
        run: timeout --signal=TERM 3m python -m pytest -vv -o faulthandler_timeout=60 tests/test_round_1g_stabilization.py
      - name: Run focused Round 1H core tests
        run: timeout --signal=TERM 3m python -m pytest -vv -o faulthandler_timeout=60 tests/test_round_1h_layers.py
      - name: Run focused Round 1H real Qt tests
        run: timeout --signal=TERM 5m python -m pytest -vv -o faulthandler_timeout=60 tests/test_round_1h_qt.py
      - name: Run recovery and background tests
        run: timeout --signal=TERM 4m python -m pytest -vv -o faulthandler_timeout=60 tests/test_recovery_v2.py tests/test_round_1e_background.py
      - name: Run full test suite
        run: timeout --signal=TERM 10m python -m pytest -vv -o faulthandler_timeout=60
      - run: python -m compileall -q pkdqc
      - run: git diff --check
